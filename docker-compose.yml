services:
  db:
    image: mysql:9.7.2-oraclelinux9
    container_name: task-assistant-database
    ports:
      - 3306:3306
    env_file:
      - .env
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    env_file:
      - .env
    container_name: task-assistant-backend
    ports:
      - 8080:80
    depends_on:
      - db